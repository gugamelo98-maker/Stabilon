<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Conversão — Stabilon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root[data-theme="dark"]{--bg:#0b0d12;--bg2:#13161e;--bg3:#1c2030;--border:#222840;--text:#e6e9f4;--text2:#7480a0;--text3:#3a4260;--accent:#4f8ef7;--green:#1fd48a;--yellow:#f5a623;--red:#f05252;--shadow:0 4px 24px rgba(0,0,0,.5);}
:root[data-theme="light"]{--bg:#eef0f8;--bg2:#fff;--bg3:#f0f2fa;--border:#dde1f0;--text:#0f1120;--text2:#5a6280;--text3:#9aa0c0;--accent:#3a7af4;--green:#0ea86e;--yellow:#c98a00;--red:#dc3535;--shadow:0 4px 16px rgba(0,0,0,.08);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s;}

header{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;letter-spacing:-.4px;display:flex;align-items:center;gap:9px;}
.ldot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:bl 2s infinite;}
@keyframes bl{0%,100%{opacity:1;}50%{opacity:.3;}}
.hright{display:flex;align-items:center;gap:10px;}
.lupd{font-size:11px;color:var(--text3);}
.gbtn{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:7px 13px;color:var(--text2);font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:5px;transition:all .2s;}
.gbtn:hover{color:var(--text);}
.pbtn{background:var(--accent);border:none;border-radius:8px;padding:7px 15px;color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:5px;transition:all .2s;}
.pbtn:hover{opacity:.85;}
.pbtn.busy{opacity:.6;pointer-events:none;}
.sp{display:inline-block;width:11px;height:11px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:rot .6s linear infinite;}
@keyframes rot{to{transform:rotate(360deg);}}

main{padding:24px 28px;max-width:1400px;margin:0 auto;}

/* CARDS RESUMO */
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px;}
.scard{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px 20px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow);animation:fu .35s ease forwards;opacity:0;}
.scard:nth-child(1){animation-delay:.05s;border-left:3px solid var(--yellow);}
.scard:nth-child(2){animation-delay:.1s;border-left:3px solid var(--red);}
.scard:nth-child(3){animation-delay:.15s;border-left:3px solid var(--green);}
@keyframes fu{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.scard-icon{font-size:22px;}
.scard-info{}
.scard-lbl{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text3);margin-bottom:4px;}
.scard-val{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;letter-spacing:-1px;line-height:1;}
.scard-sub{font-size:11px;color:var(--text2);margin-top:3px;}

/* ABAS */
.tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:4px;width:fit-content;}
.tab{padding:8px 18px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;border:none;background:transparent;color:var(--text2);font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:7px;}
.tab .cnt{background:var(--bg3);border-radius:100px;padding:1px 7px;font-size:10px;color:var(--text3);}
.tab.active{background:var(--bg3);color:var(--text);}
.tab.active .cnt{background:var(--border);}
.tab-dot{width:6px;height:6px;border-radius:50%;}
.tab-dot-y{background:var(--yellow);}
.tab-dot-r{background:var(--red);}
.tab-dot-g{background:var(--green);}

/* SEARCH */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.search{flex:1;max-width:300px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 14px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;outline:none;transition:border .2s;}
.search:focus{border-color:var(--accent);}
.search::placeholder{color:var(--text3);}
.total-lbl{font-size:12px;color:var(--text3);margin-left:auto;}

/* TABELA */
.tbl-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);animation:fu .35s .2s ease forwards;opacity:0;}
table{width:100%;border-collapse:collapse;}
thead th{padding:10px 16px;text-align:left;font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);background:var(--bg3);border-bottom:1px solid var(--border);}
tbody tr{border-bottom:1px solid var(--border);transition:background .15s;cursor:default;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:var(--bg3);}
tbody td{padding:12px 16px;font-size:13px;vertical-align:middle;}
.tc-num{color:var(--text3);font-size:11px;font-weight:600;width:40px;}
.tc-tipo .pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:100px;font-size:10px;font-weight:600;}
.pill-e{background:rgba(79,142,247,.1);color:var(--accent);}
.tc-nome .nome{font-weight:500;}
.tc-nome .fone{font-size:11px;color:var(--text2);margin-top:2px;}
.tc-prod{font-size:12px;color:var(--text2);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tc-data{font-size:12px;color:var(--text2);}
.tc-hora{font-size:12px;color:var(--text2);}
.tc-status{}
.status-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:100px;font-size:11px;font-weight:600;}
.status-pill::before{content:'';width:5px;height:5px;border-radius:50%;}
.sp-paid{background:rgba(31,212,138,.1);color:var(--green);}.sp-paid::before{background:var(--green);}
.sp-wait{background:rgba(245,166,35,.1);color:var(--yellow);}.sp-wait::before{background:var(--yellow);}
.sp-lost{background:rgba(240,82,82,.1);color:var(--red);}.sp-lost::before{background:var(--red);}
.tc-valor{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;}
.tc-afil{font-size:11px;color:var(--text3);}

.empty{padding:48px 20px;text-align:center;color:var(--text3);font-size:13px;}
.eico{font-size:32px;margin-bottom:10px;}
.ld{padding:48px 20px;text-align:center;color:var(--text3);}
.lsp{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:rot .6s linear infinite;margin:0 auto 10px;display:block;}
.err{background:rgba(240,82,82,.08);border:1px solid rgba(240,82,82,.25);border-radius:10px;padding:12px 16px;color:var(--red);font-size:12px;margin-bottom:18px;display:none;}

@media(max-width:900px){.cgrid{grid-template-columns:1fr;}main{padding:14px;}.tc-prod,.tc-afil{display:none;}}
</style>
</head>
<body>

<header>
  <div class="logo"><div class="ldot"></div>Stabilon · Conversões</div>
  <div class="hright">
    <span class="lupd" id="lupd"></span>
    <button class="gbtn" onclick="toggleTheme()"><span id="tico">☀️</span><span id="ttxt">Modo claro</span></button>
    <button class="pbtn" id="rbtn" onclick="loadData()">↻ Atualizar</button>
  </div>
</header>

<main>
  <div class="err" id="err"></div>

  <!-- CARDS -->
  <div class="cgrid">
    <div class="scard">
      <div class="scard-info">
        <div class="scard-lbl">Aguardando Pagamento</div>
        <div class="scard-val" style="color:var(--yellow)" id="cWait">—</div>
        <div class="scard-sub" id="sWait">carregando...</div>
      </div>
    </div>
    <div class="scard">
      <div class="scard-info">
        <div class="scard-lbl">Abandono de Checkout</div>
        <div class="scard-val" style="color:var(--red)" id="cLost">—</div>
        <div class="scard-sub" id="sLost">carregando...</div>
      </div>
    </div>
    <div class="scard">
      <div class="scard-info">
        <div class="scard-lbl">Finalizada / Aprovada</div>
        <div class="scard-val" style="color:var(--green)" id="cPaid">—</div>
        <div class="scard-sub" id="sPaid">carregando...</div>
      </div>
    </div>
  </div>

  <!-- ABAS -->
  <div class="tabs">
    <button class="tab active" id="tab-wait" onclick="switchTab('wait')">
      <div class="tab-dot tab-dot-y"></div>Aguardando<span class="cnt" id="cnt-wait">0</span>
    </button>
    <button class="tab" id="tab-lost" onclick="switchTab('lost')">
      <div class="tab-dot tab-dot-r"></div>Abandono<span class="cnt" id="cnt-lost">0</span>
    </button>
    <button class="tab" id="tab-paid" onclick="switchTab('paid')">
      <div class="tab-dot tab-dot-g"></div>Aprovado<span class="cnt" id="cnt-paid">0</span>
    </button>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <input class="search" id="search" type="text" placeholder="Buscar por nome, telefone ou produto..." oninput="filterTable()">
    <span class="total-lbl" id="totalLbl"></span>
  </div>

  <!-- TABELA -->
  <div class="tbl-wrap">
    <div id="tblContent"><div class="ld"><span class="lsp"></span>Carregando dados...</div></div>
  </div>
</main>

<script>
const SB='https://zbysewrhmkrkqqqdpuhu.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpieXNld3JobWtya3FxcWRwdWh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5OTA5NzgsImV4cCI6MjA5MzU2Njk3OH0.fb8YI06hjEA7ZnU9z5DdXMI6_jv3JJ8FOSx_gw_R_iE';

// Tema
const saved=localStorage.getItem('theme')||'dark';
document.documentElement.setAttribute('data-theme',saved);
if(saved==='light'){document.getElementById('tico').textContent='🌙';document.getElementById('ttxt').textContent='Modo escuro';}
function toggleTheme(){
  const d=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',d?'light':'dark');
  document.getElementById('tico').textContent=d?'🌙':'☀️';
  document.getElementById('ttxt').textContent=d?'Modo escuro':'Modo claro';
  localStorage.setItem('theme',d?'light':'dark');
}

const R$=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
const pct=v=>`${(v||0).toFixed(1)}%`;

function fmtDt(d){
  if(!d) return {dt:'—',hr:'—'};
  const o=new Date(d).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const [dt,hr]=o.split(', ');
  return {dt,hr};
}

let allData=[];
let currentTab='wait';

async function loadData(){
  const btn=document.getElementById('rbtn');
  btn.classList.add('busy');btn.innerHTML='<span class="sp"></span> Atualizando';
  document.getElementById('err').style.display='none';
  try{
    const data=await fetch(`${SB}/rest/v1/eventos_pagamentos?order=criado_em.desc&limit=1000`,{
      headers:{apikey:SK,Authorization:`Bearer ${SK}`}
    }).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json();});

    allData=data;
    renderAll();
    document.getElementById('lupd').textContent=
      'Atualizado '+new Date().toLocaleTimeString('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit'});
  }catch(e){
    const b=document.getElementById('err');b.style.display='block';
    b.textContent=`Erro ao conectar com o Supabase: ${e.message}`;
  }
  btn.classList.remove('busy');btn.innerHTML='↻ Atualizar';
}

function renderAll(){
  const wait=allData.filter(d=>d.status==='waiting_payment');
  const lost=allData.filter(d=>d.status==='lost_cart');
  const paid=allData.filter(d=>d.status==='paid');
  const tot=allData.length;

  // Cards
  document.getElementById('cWait').textContent=wait.length;
  document.getElementById('sWait').textContent=`${pct(tot?wait.length/tot*100:0)} do total`;
  document.getElementById('cLost').textContent=lost.length;
  document.getElementById('sLost').textContent=`${pct(tot?lost.length/tot*100:0)} do total`;
  document.getElementById('cPaid').textContent=paid.length;
  const rec=paid.reduce((s,d)=>s+(d.valor||0),0);
  document.getElementById('sPaid').textContent=`${R$(rec)} em receita`;

  // Contadores abas
  document.getElementById('cnt-wait').textContent=wait.length;
  document.getElementById('cnt-lost').textContent=lost.length;
  document.getElementById('cnt-paid').textContent=paid.length;

  renderTable();
}

function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(`tab-${tab}`).classList.add('active');
  document.getElementById('search').value='';
  renderTable();
}

function filterTable(){renderTable();}

function getTabData(){
  const map={wait:'waiting_payment',lost:'lost_cart',paid:'paid'};
  return allData.filter(d=>d.status===map[currentTab]);
}

function renderTable(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  let data=getTabData();
  if(q) data=data.filter(d=>
    (d.lead_name||'').toLowerCase().includes(q)||
    (d.lead_phone||'').includes(q)||
    (d.produto||'').toLowerCase().includes(q)
  );

  document.getElementById('totalLbl').textContent=`${data.length} registro${data.length!==1?'s':''}`;

  if(!data.length){
    document.getElementById('tblContent').innerHTML=`<div class="empty">${q?'Nenhum resultado para a busca':'Nenhum registro nessa etapa ainda'}</div>`;
    return;
  }

  const scls={waiting_payment:'sp-wait',lost_cart:'sp-lost',paid:'sp-paid'};
  const slbl={waiting_payment:'Aguardando',lost_cart:'Abandono',paid:'Enviado'};

  const rows=data.map((d,i)=>{
    const {dt,hr}=fmtDt(d.criado_em);
    return `<tr>
      <td class="tc-num">${i+1}</td>
      <td class="tc-tipo"><span class="pill pill-e">Envio</span></td>
      <td class="tc-nome">
        <div class="nome">${d.lead_name||'—'}</div>
        <div class="fone">${d.lead_phone||''}</div>
      </td>
      <td class="tc-prod">${d.produto||'—'}</td>
      <td class="tc-data">${dt}</td>
      <td class="tc-hora">${hr}</td>
      <td class="tc-status"><span class="status-pill ${scls[d.status]||''}">● ${slbl[d.status]||d.status}</span></td>
      <td class="tc-afil">${d.afiliado_nome||'—'}</td>
    </tr>`;
  }).join('');

  document.getElementById('tblContent').innerHTML=`
    <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th>#</th><th>Tipo</th><th>Nome</th><th>Produto</th><th>Data</th><th>Hora</th><th>Status / Ação</th><th>Afiliado</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

loadData();
setInterval(loadData,60000);
</script>
</body>
</html>
