<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Conversão — Stabilon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root[data-theme="dark"]{
  --bg:#0b0d12;--bg2:#13161e;--bg3:#1a1e2a;--border:#1e2338;
  --text:#e4e8f4;--text2:#6e7a9a;--text3:#343d5a;
  --accent:#4f8ef7;--green:#1fd48a;--yellow:#f5a623;--red:#f05252;
  --sidebar:#0f1118;--shadow:0 2px 16px rgba(0,0,0,.4);
}
:root[data-theme="light"]{
  --bg:#f0f2f9;--bg2:#fff;--bg3:#f5f6fc;--border:#e0e4f0;
  --text:#0f1120;--text2:#5a6280;--text3:#9aa0c0;
  --accent:#3a7af4;--green:#0ea86e;--yellow:#c98a00;--red:#dc3535;
  --sidebar:#fff;--shadow:0 2px 12px rgba(0,0,0,.07);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;transition:background .3s,color .3s;}

/* SIDEBAR */
.sidebar{width:220px;min-height:100vh;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:200;}
.sb-logo{padding:22px 20px 18px;border-bottom:1px solid var(--border);}
.sb-logo-txt{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;}
.sb-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:bl 2s infinite;}
@keyframes bl{0%,100%{opacity:1;}50%{opacity:.3;}}
.sb-sub{font-size:10px;color:var(--text3);margin-top:4px;letter-spacing:.5px;text-transform:uppercase;}

.sb-nav{flex:1;padding:16px 12px;}
.sb-section{font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--text3);padding:0 8px;margin-bottom:8px;margin-top:16px;}
.sb-section:first-child{margin-top:0;}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;transition:all .2s;color:var(--text2);font-size:13px;font-weight:500;border:none;background:transparent;width:100%;text-align:left;font-family:'DM Sans',sans-serif;}
.sb-item:hover{background:var(--bg3);color:var(--text);}
.sb-item.active{background:var(--bg3);color:var(--text);}
.sb-item.active .sb-ico{color:var(--accent);}
.sb-ico{width:16px;text-align:center;font-size:14px;flex-shrink:0;}
.sb-cnt{margin-left:auto;background:var(--bg);border-radius:100px;padding:1px 7px;font-size:10px;color:var(--text3);}
.sb-item.active .sb-cnt{background:var(--border);color:var(--text2);}

.sb-bottom{padding:12px;border-top:1px solid var(--border);}
.sb-theme{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--text2);font-size:12px;font-weight:500;transition:all .2s;border:none;background:transparent;width:100%;font-family:'DM Sans',sans-serif;}
.sb-theme:hover{background:var(--bg3);color:var(--text);}
.live-wrap{display:flex;align-items:center;gap:6px;padding:6px 10px;font-size:11px;color:var(--green);}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:bl 1.5s infinite;}

/* CONTEÚDO PRINCIPAL */
.content{margin-left:220px;flex:1;min-height:100vh;display:flex;flex-direction:column;}

/* TOPBAR */
.topbar{padding:14px 28px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.topbar-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;}
.topbar-right{display:flex;align-items:center;gap:10px;}
#lupd{font-size:11px;color:var(--text3);}
.pbtn{background:var(--accent);border:none;border-radius:8px;padding:7px 15px;color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:5px;transition:all .2s;}
.pbtn:hover{opacity:.85;}
.pbtn.busy{opacity:.6;pointer-events:none;}
.sp{display:inline-block;width:11px;height:11px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:rot .6s linear infinite;}
@keyframes rot{to{transform:rotate(360deg);}}

/* MAIN AREA */
.main-area{padding:22px 28px;flex:1;}

/* CARDS */
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
.scard{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);animation:fu .35s ease forwards;opacity:0;}
.scard:nth-child(1){animation-delay:.05s;border-top:2px solid var(--yellow);}
.scard:nth-child(2){animation-delay:.1s;border-top:2px solid var(--red);}
.scard:nth-child(3){animation-delay:.15s;border-top:2px solid var(--green);}
@keyframes fu{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.clbl{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text3);margin-bottom:8px;}
.cval{font-family:'Syne',sans-serif;font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1;margin-bottom:6px;}
.csub{font-size:11px;color:var(--text2);}

/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.search{flex:1;max-width:280px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 14px;color:var(--text);font-size:12px;font-family:'DM Sans',sans-serif;outline:none;transition:border .2s;}
.search:focus{border-color:var(--accent);}
.search::placeholder{color:var(--text3);}
.tlbl{font-size:11px;color:var(--text3);margin-left:auto;}

/* TABELA */
.tbl-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);animation:fu .35s .2s ease forwards;opacity:0;}
table{width:100%;border-collapse:collapse;}
thead th{padding:9px 14px;text-align:left;font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);background:var(--bg3);border-bottom:1px solid var(--border);}
tbody tr{border-bottom:1px solid var(--border);transition:background .15s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:var(--bg3);}
tbody td{padding:11px 14px;font-size:12px;vertical-align:middle;}
.tc-num{color:var(--text3);font-size:11px;width:36px;}
.nome{font-weight:500;font-size:13px;}
.fone{font-size:11px;color:var(--text2);margin-top:1px;}
.prod{font-size:11px;color:var(--text2);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tc-dt{font-size:11px;color:var(--text2);}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:100px;font-size:10px;font-weight:600;}
.pill::before{content:'';width:4px;height:4px;border-radius:50%;}
.pp{background:rgba(31,212,138,.1);color:var(--green);}.pp::before{background:var(--green);}
.pw{background:rgba(245,166,35,.1);color:var(--yellow);}.pw::before{background:var(--yellow);}
.pl{background:rgba(240,82,82,.1);color:var(--red);}.pl::before{background:var(--red);}
.tm{font-family:'Syne',sans-serif;font-weight:700;font-size:12px;}
.afil{font-size:11px;color:var(--text3);}

.empty{padding:40px 20px;text-align:center;color:var(--text3);font-size:12px;}
.ld{padding:40px 20px;text-align:center;color:var(--text3);}
.lsp{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:rot .6s linear infinite;margin:0 auto 10px;display:block;}
.err{background:rgba(240,82,82,.08);border:1px solid rgba(240,82,82,.2);border-radius:10px;padding:12px 16px;color:var(--red);font-size:12px;margin-bottom:16px;display:none;}

@media(max-width:768px){.sidebar{display:none;}.content{margin-left:0;}.cgrid{grid-template-columns:1fr 1fr;}.main-area{padding:14px;}}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sb-logo">
    <div class="sb-logo-txt"><div class="sb-dot"></div>Stabilon</div>
    <div class="sb-sub">Painel de Conversões</div>
  </div>
  <nav class="sb-nav">
    <div class="sb-section">Pagamentos</div>
    <button class="sb-item active" id="nav-wait" onclick="switchTab('wait')">
      <span class="sb-ico">◐</span>Aguardando<span class="sb-cnt" id="cnt-wait">0</span>
    </button>
    <button class="sb-item" id="nav-lost" onclick="switchTab('lost')">
      <span class="sb-ico">○</span>Abandono<span class="sb-cnt" id="cnt-lost">0</span>
    </button>
    <button class="sb-item" id="nav-paid" onclick="switchTab('paid')">
      <span class="sb-ico">●</span>Aprovado<span class="sb-cnt" id="cnt-paid">0</span>
    </button>
  </nav>
  <div class="sb-bottom">
    <div class="live-wrap"><div class="live-dot"></div>ao vivo · <span id="lupd2"></span></div>
    <button class="sb-theme" onclick="toggleTheme()"><span id="tico">☀️</span><span id="ttxt">Modo claro</span></button>
  </div>
</aside>

<!-- CONTEÚDO -->
<div class="content">
  <div class="topbar">
    <div class="topbar-title" id="topTitle">Aguardando Pagamento</div>
    <div class="topbar-right">
      <span id="lupd"></span>
      <button class="pbtn" id="rbtn" onclick="loadData()">↻ Atualizar</button>
    </div>
  </div>

  <div class="main-area">
    <div class="err" id="err"></div>

    <!-- CARDS -->
    <div class="cgrid">
      <div class="scard">
        <div class="clbl">Aguardando Pagamento</div>
        <div class="cval" style="color:var(--yellow)" id="cWait">—</div>
        <div class="csub" id="sWait">—</div>
      </div>
      <div class="scard">
        <div class="clbl">Abandono de Checkout</div>
        <div class="cval" style="color:var(--red)" id="cLost">—</div>
        <div class="csub" id="sLost">—</div>
      </div>
      <div class="scard">
        <div class="clbl">Finalizada / Aprovada</div>
        <div class="cval" style="color:var(--green)" id="cPaid">—</div>
        <div class="csub" id="sPaid">—</div>
      </div>
    </div>

    <!-- TOOLBAR -->
    <div class="toolbar">
      <input class="search" id="search" type="text" placeholder="Buscar nome, telefone ou produto..." oninput="filterTable()">
      <span class="tlbl" id="tlbl"></span>
    </div>

    <!-- TABELA -->
    <div class="tbl-wrap">
      <div id="tblContent"><div class="ld"><span class="lsp"></span>Carregando dados...</div></div>
    </div>
  </div>
</div>

<script>
const SB='https://zbysewrhmkrkqqqdpuhu.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpieXNld3JobWtya3FxcWRwdWh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5OTA5NzgsImV4cCI6MjA5MzU2Njk3OH0.fb8YI06hjEA7ZnU9z5DdXMI6_jv3JJ8FOSx_gw_R_iE';

const saved=localStorage.getItem('theme')||'dark';
document.documentElement.setAttribute('data-theme',saved);
if(saved==='light'){document.getElementById('tico').textContent='🌙';document.getElementById('ttxt').textContent='Modo escuro';}
function toggleTheme(){
  const d=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',d?'light':'dark');
  document.getElementById('tico').textContent=d?'🌙':'☀️';
  document.getElementById('ttxt').textContent=d?'Modo escuro':'Modo claro';
  localStorage.setItem('theme',d?'light':'dark');
}

const R$=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
const pct=v=>`${(v||0).toFixed(1)}%`;
function fmtDt(d){
  if(!d)return{dt:'—',hr:'—'};
  const s=new Date(d).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const p=s.split(', ');return{dt:p[0]||'—',hr:p[1]||'—'};
}

const TITLES={wait:'Aguardando Pagamento',lost:'Abandono de Checkout',paid:'Finalizada / Aprovada'};
const SC={waiting_payment:'pw',lost_cart:'pl',paid:'pp'};
const SL={waiting_payment:'Aguardando',lost_cart:'Abandono',paid:'Enviado'};

let allData=[];
let currentTab='wait';

async function loadData(){
  const btn=document.getElementById('rbtn');
  btn.classList.add('busy');btn.innerHTML='<span class="sp"></span> Atualizando';
  document.getElementById('err').style.display='none';
  try{
    const data=await fetch(`${SB}/rest/v1/eventos_pagamentos?order=criado_em.desc&limit=1000`,{
      headers:{apikey:SK,Authorization:`Bearer ${SK}`}
    }).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json();});
    allData=data;
    renderAll();
    const t=new Date().toLocaleTimeString('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit'});
    document.getElementById('lupd').textContent=t;
    document.getElementById('lupd2').textContent=t;
  }catch(e){
    const b=document.getElementById('err');b.style.display='block';
    b.textContent=`Erro ao conectar: ${e.message}`;
  }
  btn.classList.remove('busy');btn.innerHTML='↻ Atualizar';
}

function renderAll(){
  const wait=allData.filter(d=>d.status==='waiting_payment');
  const lost=allData.filter(d=>d.status==='lost_cart');
  const paid=allData.filter(d=>d.status==='paid');
  const tot=allData.length;
  const rec=paid.reduce((s,d)=>s+(d.valor||0),0);

  document.getElementById('cWait').textContent=wait.length;
  document.getElementById('sWait').textContent=`${pct(tot?wait.length/tot*100:0)} do total`;
  document.getElementById('cLost').textContent=lost.length;
  document.getElementById('sLost').textContent=`${pct(tot?lost.length/tot*100:0)} do total`;
  document.getElementById('cPaid').textContent=paid.length;
  document.getElementById('sPaid').textContent=`${R$(rec)} em receita`;

  document.getElementById('cnt-wait').textContent=wait.length;
  document.getElementById('cnt-lost').textContent=lost.length;
  document.getElementById('cnt-paid').textContent=paid.length;

  renderTable();
}

function switchTab(tab){
  currentTab=tab;
  ['wait','lost','paid'].forEach(t=>{
    document.getElementById(`nav-${t}`).classList.toggle('active',t===tab);
  });
  document.getElementById('topTitle').textContent=TITLES[tab];
  document.getElementById('search').value='';
  renderTable();
}

function filterTable(){renderTable();}

function renderTable(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  const map={wait:'waiting_payment',lost:'lost_cart',paid:'paid'};
  let data=allData.filter(d=>d.status===map[currentTab]);
  if(q)data=data.filter(d=>
    (d.lead_name||'').toLowerCase().includes(q)||
    (d.lead_phone||'').includes(q)||
    (d.produto||'').toLowerCase().includes(q)
  );

  document.getElementById('tlbl').textContent=`${data.length} registro${data.length!==1?'s':''}`;

  if(!data.length){
    document.getElementById('tblContent').innerHTML='<div class="empty">Nenhum registro nessa etapa ainda</div>';
    return;
  }

  const rows=data.map((d,i)=>{
    const{dt,hr}=fmtDt(d.criado_em);
    return`<tr>
      <td class="tc-num">${i+1}</td>
      <td><div class="nome">${d.lead_name||'—'}</div><div class="fone">${d.lead_phone||''}</div></td>
      <td><div class="prod">${d.produto||'—'}</div></td>
      <td class="tc-dt">${dt}</td>
      <td class="tc-dt">${hr}</td>
      <td><span class="pill ${SC[d.status]||''}">${SL[d.status]||d.status}</span></td>
      <td class="tm" style="color:${d.status==='paid'?'var(--green)':'var(--text)'}">${R$(d.valor)}</td>
      <td class="afil">${d.afiliado_nome||'—'}</td>
    </tr>`;
  }).join('');

  document.getElementById('tblContent').innerHTML=`
    <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th>#</th><th>Nome / Telefone</th><th>Produto</th><th>Data</th><th>Hora</th><th>Status</th><th>Valor</th><th>Afiliado</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

loadData();
setInterval(loadData,60000);
</script>
</body>
</html>
